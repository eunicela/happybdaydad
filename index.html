<title>Happy Birthday, Dad</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#07080f;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    font-family:ui-monospace, Menlo, Consolas, monospace;
  }
  #game { display:block; width:100%; height:100%; image-rendering:pixelated; object-fit:contain; }
  #pad {
    position:fixed; inset:auto 0 0 0; height:32%; max-height:200px;
    pointer-events:none; z-index:10;
    padding:0 4vw calc(3vh + env(safe-area-inset-bottom)) 4vw;
    display:flex; align-items:flex-end; justify-content:space-between;
  }
  .btn {
    pointer-events:auto;
    width:19vw; height:19vw; max-width:86px; max-height:86px; min-width:58px; min-height:58px;
    border-radius:50%;
    background:rgba(255,255,255,0.10); border:2px solid rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.75); font-size:min(7vw,29px); line-height:1;
    transition:background .06s, transform .06s, box-shadow .2s;
  }
  .btn.on { background:rgba(255,214,140,0.34); transform:scale(0.94); color:#fff; }
  .btn.hint { box-shadow:0 0 0 3px rgba(255,211,110,0.5); background:rgba(255,211,110,0.24); color:#fff; }
  #dpad { display:flex; gap:3vw; }
  #mute {
    position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; z-index:11;
    width:34px; height:34px; border-radius:8px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    color:rgba(255,255,255,0.6); font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  #pad.hide, #mute.hide { opacity:0; pointer-events:none; }
  #pad, #mute { transition:opacity .4s; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="mute" class="hide">♪</div>

  <div id="dpad"><div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div></div>
  <div class="btn" id="ba">▲</div>

const LINE_H = 10, SPACE_W = 4;
const font = {};
for (const ch in GLYPHS) {
  const rows = GLYPHS[ch].split("/");
  let min = 5, max = -1;
  for (const r of rows) for (let c = 0; c < 5; c++)
    if (r[c] === "1") { if (c < min) min = c; if (c > max) max = c; }
  font[ch] = max < 0 ? { w:SPACE_W, min:0, rows:[] } : { w:max-min+1, min, rows };
}
function textW(str) {
  let w = 0;
  for (const ch of str) {
    if (ch === " ") { w += SPACE_W; continue; }
    const g = font[ch];
    w += (g ? g.w : 3) + 1;
  }
  return Math.max(0, w - 1);
}
function drawText(str, x, y, color, align) {
  if (!str) return;
  let dx = align === "center" ? Math.round(x - textW(str)/2)
         : align === "right"  ? Math.round(x - textW(str)) : Math.round(x);
  y = Math.round(y);
  ctx.fillStyle = color;
  for (const ch of str) {
    if (ch === " ") { dx += SPACE_W; continue; }
    const g = font[ch];
    if (!g) { dx += 4; continue; }
    for (let r = 0; r < g.rows.length; r++) {
      const row = g.rows[r];
      for (let c = 0; c < g.w; c++)
        if (row[g.min + c] === "1") ctx.fillRect(dx + c, y + r, 1, 1);
    }
    dx += g.w + 1;
  }
}
function wrap(str, maxPx) {
  const out = []; let line = "";
  for (const w of str.split(" ")) {
    const t = line ? line + " " + w : w;
    if (textW(t) > maxPx && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
function resize() {
  if (PREVIEW) { VIEW_W = ROOM_W; VIEW_H = WORLD_BOT; }
  else {
    VIEW_W = 128;
    VIEW_H = Math.max(190, Math.min(400, Math.round(VIEW_W * innerHeight / innerWidth)));

  cv.width = VIEW_W; cv.height = VIEW_H;

}

function px(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x|0, y|0, w|0, h|0); }

  x = Math.round(x); y = Math.round(y);
  const w = sp[0].length;

    const row = sp[r];
    for (let c = 0; c < w; c++) {
      const col = pal[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + (flip ? w-1-c : c), y + r, 1, 1);

}

// ───────────────────────────────────────────────────────── world geometry ──
// Collision is a height-map: for any x, each floor contributes a walking
// surface. Stairs are just surfaces 6px apart, so "hold ▶" walks him up.
const gaps  = [];        // hole in floor i's slab (where the stairs arrive)
const steps = [];        // {x0,x1,y,floor,k} every stair tread

function buildWorld() {
  for (let i = 0; i < FLOORS; i++) {
    gaps[i] = i === 0 ? null
            : goesRight(i-1) ? { x0:LAND_X0, x1:ROOM_W } : { x0:0, x1:ROOM_W-LAND_X0 };
    if (i < TOP) {
      const gy = groundY(i), right = goesRight(i);
      for (let k = 0; k < STEPS; k++) {
        const y = gy - RISE*(k+1);
        const xr0 = k === STEPS-1 ? LAND_X0 : STAIR_X0 + RUN*k;
        const xr1 = k === STEPS-1 ? ROOM_W  : xr0 + RUN;
        steps.push(right ? { x0:xr0, x1:xr1, y, floor:i, k }
                         : { x0:ROOM_W-xr1, x1:ROOM_W-xr0, y, floor:i, k });
      }
    }
  }
}
buildWorld();

function surfacesAt(x) {
  const out = [];
  for (let i = 0; i < FLOORS; i++) {
    const h = gaps[i];
    if (!h || x < h.x0 || x >= h.x1) out.push(groundY(i));
  }
  for (const s of steps) if (x >= s.x0 && x < s.x1) out.push(s.y);
  return out;
}

const dad = { x:24, y:groundY(0)-P_H, vx:0, onGround:true, flip:false, anim:0, floor:0, vy:0 };

function movePlayer(dt) {
  const dir = (keys.right?1:0) - (keys.left?1:0);
  dad.vx = dir * WALK;
  if (dir) dad.flip = dir < 0;
  dad.x = clamp(dad.x + dad.vx*dt, 2, ROOM_W - P_W - 2);
  const cx = dad.x + P_W/2;

  if (dad.onGround) {
    const feet = dad.y + P_H;
    let best = null;
    for (const s of surfacesAt(cx))
      if (s >= feet - STEP_UP && s <= feet + STEP_DOWN && (best === null || s < best)) best = s;
    if (best !== null) { dad.y = best - P_H; dad.vy = 0; }
    else dad.onGround = false;
  }
  if (!dad.onGround) {
    dad.vy = Math.min(dad.vy + GRAV*dt, MAXFALL);
    const ny = dad.y + dad.vy*dt;
    if (dad.vy > 0) {
      const f0 = dad.y + P_H, f1 = ny + P_H;
      let land = null;
      for (const s of surfacesAt(cx))
        if (s >= f0 - 0.6 && s <= f1 && (land === null || s < land)) land = s;
      if (land !== null) { dad.y = land - P_H; dad.vy = 0; dad.onGround = true; }
      else dad.y = ny;
    } else dad.y = ny;
  }
  if (dad.y > WORLD_H + 60) { dad.x = 24; dad.y = groundY(0) - P_H; dad.vy = 0; }

  // floor() not round(), so the floor only changes when he actually arrives
  const f = clamp(Math.floor((WORLD_H - (dad.y + P_H) + 1) / FLOOR_H), 0, TOP);
  if (f !== dad.floor) {
    dad.floor = f;
    banner.text = f === TOP ? CONFIG.kitchenName : CONFIG.floors[f].name;
    banner.t = 3.2;
    if (f > visited) { visited = f; sfx.arrive(); }
  }
  if (dad.onGround && dir) {
    dad.anim += dt * 7.5;
    stepTimer -= dt;
    if (stepTimer <= 0) { stepTimer = 0.26; sfx.step(); }
  } else if (!dir) { dad.anim = 0; stepTimer = 0; }
}

// ───────────────────────────────────────────────────────────────── audio ──
const audio = { ctx:null, gain:null, muted:!CONFIG.music, next:0, step:0 };
function initAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  audio.gain = audio.ctx.createGain();
  audio.gain.gain.value = audio.muted ? 0 : 0.5;
  audio.gain.connect(audio.ctx.destination);
  if (CONFIG.music) { audio.next = audio.ctx.currentTime + 0.2; setInterval(schedule, 90); }
}
function note(freq, when, dur, vol, type) {
  if (!audio.ctx) return;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(audio.gain);
  o.start(when); o.stop(when + dur + 0.03);
}
const N = { C4:261.6,D4:293.7,E4:329.6,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,G5:784,C6:1046.5 };
const LOOP = [N.C4,N.E4,N.G4,N.E4,N.A4,N.G4,N.E4,N.D4];
function schedule() {
  if (!audio.ctx || state.mode === "party" || state.mode === "message") return;
  const t = audio.ctx.currentTime;
  while (audio.next < t + 0.4) {
    const i = audio.step % LOOP.length;
    note(LOOP[i], audio.next, 0.45, 0.045, "triangle");
    if (visited >= 2 && i % 2 === 0) note(LOOP[i]*2, audio.next, 0.3, 0.02, "square");
    if (visited >= 4) note(LOOP[i]/2, audio.next, 0.5, 0.03, "sine");
    audio.next += 0.34; audio.step++;
  }
}
const sfx = {
  step()  { if (audio.ctx) note(90 + Math.random()*22, audio.ctx.currentTime, 0.05, 0.03, "square"); },
  jump()  { if (audio.ctx) { const t = audio.ctx.currentTime; note(330,t,0.09,0.06); note(520,t+0.05,0.09,0.05); } },
  chime() { if (audio.ctx) { const t = audio.ctx.currentTime; [N.E5,N.G5,N.C6].forEach((f,i)=>note(f,t+i*0.075,0.3,0.07,"triangle")); } },
  arrive(){ if (audio.ctx) { const t = audio.ctx.currentTime; note(N.G4,t,0.16,0.05,"triangle"); note(N.C5,t+0.1,0.24,0.05,"triangle"); } },
  pop()   { if (audio.ctx) note(180 + Math.random()*400, audio.ctx.currentTime, 0.1, 0.05, "square"); },
};
const HB_SONG = [
  [N.D4,.5],[N.D4,.25],[N.E4,.75],[N.D4,.75],[N.G4,.75],[N.A4,1.4],
  [N.D4,.5],[N.D4,.25],[N.E4,.75],[N.D4,.75],[N.A4,.75],[N.G4,1.4],
  [N.D4,.5],[N.D4,.25],[N.D5,.75],[N.B4,.75],[N.G4,.75],[N.A4,.75],[N.E4,1.4],
  [N.C5,.5],[N.C5,.25],[N.B4,.75],[N.G4,.75],[N.A4,.75],[N.G4,1.8],
];
function playHappyBirthday() {
  if (!audio.ctx) return;
  let t = audio.ctx.currentTime + 0.35;
  for (const [f, len] of HB_SONG) {
    note(f, t, len*0.39, 0.09, "triangle");
    note(f/2, t, len*0.39, 0.045, "sine");
    t += len * 0.42;
  }
}

function action() {
  if (state.mode === "title") { start(); return; }
  if (state.open) { closePainting(); return; }
  if (state.mode === "play") {
    const p = nearPainting();
    if (p) { openPainting(p); return; }
    if (nearCake() && !state.candles) { blowOut(); return; }
    if (dad.onGround) { dad.onGround = false; dad.vy = JUMP_V; sfx.jump(); }
    return;
  }
  if (state.mode === "party" && state.partyT > 3.2) showMessage();
}
function start() {
  if (state.mode !== "title") return;
  initAudio();
  state.mode = "play";
  document.getElementById("pad").classList.remove("hide");
  muteEl.classList.remove("hide");
  banner.text = CONFIG.floors[0].name; banner.t = 3.2;
}

function blowOut() {
  state.candles = true; state.mode = "party"; state.partyT = 0;
  keys.left = keys.right = false;
  // frame the whole group, not just him — otherwise Mum ends up off-screen
  const left = Math.min(...family.map(f => f.x));
  state.camLockX = clamp((left + dad.x + 12)/2 - VIEW_W/2, 0, ROOM_W - VIEW_W);
  document.getElementById("pad").classList.add("hide");

  ctx.globalAlpha = 0.12; px(168, gy-38, 34, 24, C.warm); ctx.globalAlpha = 1;
  px(142, gy-25, 12, 3, "#e6e2d4"); px(146, gy-28, 9, 3, "#cfd6e0");
}
function drawMusic(gy, ty) {
  drawWindow(276, ty+12, 32, 26, 3);
  // upright piano
  px(140, gy-40, 66, 30, "#4a2f24"); px(140, gy-40, 66, 2, "#7a5344");
  px(140, gy-38, 66, 1, "#33211b");
  px(144, gy-34, 58, 11, "#31201a"); px(144, gy-34, 58, 1, "#231713");
  px(150, gy-31, 46, 5, "#3d2820");
  px(140, gy-12, 66, 5, "#3a251c"); px(140, gy-12, 66, 1, "#5c3c2c");
  for (let x = 144; x < 200; x += 4) { px(x, gy-11, 3, 3, "#efe8db"); px(x+2, gy-11, 1, 2, "#20191c"); }
  px(138, gy-7, 4, 7, "#31201a"); px(204, gy-7, 4, 7, "#31201a");
  // stool
  px(210, gy-14, 18, 3, "#5a3d26"); px(212, gy-11, 3, 11, "#4a3120"); px(223, gy-11, 3, 11, "#4a3120");
  // guitar on a stand
  px(256, gy-30, 2, 22, "#6a5a4a"); px(250, gy-8, 14, 2, "#6a5a4a");
  px(252, gy-26, 10, 12, "#a5643c"); px(255, gy-23, 4, 4, "#4a3120");
  px(256, gy-38, 2, 12, "#7a5636"); px(255, gy-40, 4, 3, "#3a2f26");
  ctx.globalAlpha = 0.10; px(132, gy-46, 90, 46, C.warm); ctx.globalAlpha = 1;
}
function drawLanding(gy, ty) {
  // stairs take x 200-320 on this floor, so everything lives to the left
  px(8, ty+8, 30, gy-ty-8, "#6a4a30"); px(11, ty+11, 24, gy-ty-14, "#7d5a3a"); px(32, gy-24, 2, 2, C.gold);
  drawWindow(146, ty+10, 32, 28, 4);
  px(52, gy-16, 24, 3, C.wood); px(54, gy-13, 3, 13, C.woodDk); px(71, gy-13, 3, 13, C.woodDk);
  px(58, gy-24, 10, 8, "#a5643c");
  px(56, gy-32, 3, 9, C.green); px(61, gy-36, 3, 13, "#7fce9a"); px(66, gy-31, 3, 8, C.green);
  smallFrame(140, gy-30, 14, 12); smallFrame(160, gy-24, 12, 10);
  px(44, gy-4, 26, 4, "#6a4a30");
}
function drawKitchen(gy, ty) {
  ctx.globalAlpha = 0.10; px(0, ty, ROOM_W, gy-ty, C.warm); ctx.globalAlpha = 1;
  // counter run on the right, with a tiled backsplash above it
  for (let x = 240; x < 288; x += 8)
    for (let y = gy-42; y < gy-26; y += 8)
      px(x, y, 8, 8, (x/8 + y/8) % 2 ? "#b8ad98" : "#c8bda8");
  px(240, gy-42, 48, 1, "#d6cbb6");
  px(236, gy-26, 56, 5, "#cfc4ae"); px(238, gy-21, 52, 21, "#7a6249");
  px(262, gy-21, 1, 21, "#63503c");
  px(248, gy-30, 12, 4, "#9aa0ad"); px(274, gy-32, 10, 6, C.red);
  px(28, gy-48, 26, 48, "#dfe3ea"); px(28, gy-28, 26, 1, "#b9bfc9");
  px(50, gy-42, 2, 8, "#9aa0ad"); px(50, gy-22, 2, 8, "#9aa0ad");
  px(33, gy-44, 7, 6, C.gold); px(42, gy-43, 6, 5, C.pink);
  drawWindow(246, ty+8, 34, 18, 5);
  px(TABLE.x, TABLE.y, TABLE.w, TABLE.h, "#a57a4e"); px(TABLE.x, TABLE.y, TABLE.w, 1, "#c29565");
  px(TABLE.x+5, TABLE.y+4, 4, 18, C.woodDk); px(TABLE.x+TABLE.w-9, TABLE.y+4, 4, 18, C.woodDk);
  px(TABLE.x+8, TABLE.y-4, 8, 4, "#cfd6e0"); px(TABLE.x+56, TABLE.y-3, 7, 3, "#cfd6e0");
  const by = ty + 5;
  px(4, by, ROOM_W-8, 1, "#8a7a5a");
  const flags = [C.pink, C.gold, C.green, "#7fb4ff", C.red];
  for (let i = 0, x = 8; x < ROOM_W-12; x += 14, i++) {
    const col = flags[i % flags.length];
    for (let r = 0; r < 6; r++) px(x+r, by+1+r, 12-r*2, 1, col);
  }
  [70, 150, 236].forEach(x => {
    px(x, by+1, 1, 9, "#4a4230"); px(x-4, by+10, 9, 5, "#f7e6a8");
    ctx.globalAlpha = 0.12; px(x-24, by+10, 49, 50, C.warm); ctx.globalAlpha = 1;
  });
}

const RAIL_H = 17;           // handrail height above the tread nosing
function drawStairs() {
  // treads, and the diagonal stringer carrying them
  for (const s of steps) {
    const w = s.x1 - s.x0, thick = RISE + 9;
    px(s.x0, s.y, w, thick, C.stair);
    px(s.x0, s.y, w, 1, C.stairHi);
    px(s.x0, s.y + 1, w, 1, "#8a6340");
    px(s.x0, s.y + thick - 1, w, 1, C.stairLo);
    const nose = goesRight(s.floor) ? s.x1 - 1 : s.x0;
    px(nose, s.y, 1, thick, "#5b3d24");
  }
  // banister: rail segment per step, plus a riser link so it reads continuous
  for (const s of steps) {
    if (s.k === STEPS - 1) continue;
    const w = s.x1 - s.x0, ry = s.y - RAIL_H;
    px(s.x0, ry, w, 2, "#a3764c");
    px(s.x0, ry + 2, w, 1, "#6b4a2e");
    const up = goesRight(s.floor) ? s.x1 - 1 : s.x0;
    px(up, ry - RISE, 1, RISE + 2, "#a3764c");           // link to the next segment
    if (s.k % 2 === 0) px(goesRight(s.floor) ? s.x0 + 1 : s.x1 - 2, ry + 2, 1, RAIL_H - 2, C.rail);
  }
  // newel post at the bottom of each flight
  for (const s of steps) {
    if (s.k !== 0) continue;
    const x = goesRight(s.floor) ? s.x0 : s.x1 - 2;
    px(x, s.y - RAIL_H - 1, 2, RAIL_H + 8, "#5b3d24");
    px(x, s.y - RAIL_H - 3, 2, 2, "#a3764c");
  }
}
function drawSlabs() {
  for (let i = 0; i < FLOORS; i++) {
    const gy = groundY(i), h = gaps[i];
    const segs = !h ? [[0, ROOM_W]] : h.x0 === 0 ? [[h.x1, ROOM_W]] : [[0, h.x0]];
    for (const [a, b] of segs) {
      px(a, gy, b-a, SLAB, C.slab);
      px(a, gy, b-a, 1, FLOORCOL[i]);
      px(a, gy+1, b-a, 1, C.slabHi);
      px(a, gy+SLAB-2, b-a, 2, C.slabLo);
      for (let x = a - (a % 14); x < b; x += 14) if (x >= a) px(x, gy+2, 1, SLAB-4, "#54402f");
    }
  }
  const ry = roomTop(TOP) - ROOF;
  for (let x = 0; x < ROOM_W; x++) {
    const h = Math.max(3, ROOF - Math.abs(x - ROOM_W/2) * (ROOF-5) / (ROOM_W/2));
    px(x, ry+ROOF-h, 1, h, "#6a4a44");
    px(x, ry+ROOF-h, 1, 1, "#87605a");
    if (x % 9 === 0) px(x, ry+ROOF-h+2, 1, h-2, "#5c403b");
  }
  px(238, ry+1, 15, 22, "#4a3a3e"); px(238, ry+1, 15, 2, "#5e4a4e");
}

function drawPaintings(t) {
  for (const p of paintings) {
    px(p.x-1, p.y-1, FR_W+2, FR_H+2, "rgba(0,0,0,0.35)");
    px(p.x, p.y, FR_W, FR_H, C.frame);
    px(p.x, p.y, FR_W, 1, C.frameHi); px(p.x, p.y, 1, FR_H, C.frameHi);
    scene(p.scene, p.x+1, p.y+1, 1);
    px(p.x + (FR_W>>1) - 3, p.y - 5, 7, 2, "#c9a24a");
    px(p.x + (FR_W>>1), p.y - 8, 1, 3, "#7a6a4a");
    ctx.globalAlpha = 0.09 + (p.seen ? 0.04 : 0.06 * Math.abs(Math.sin(t*2)));
    px(p.x - 4, p.y - 5, FR_W + 8, FR_H + 10, C.warm);
    ctx.globalAlpha = 1;
  }
}

const pal = m => ({ h:m.hair, s:m.skin, e:"#241f2c", m:"#a35c58", S:m.shirt, P:m.pants, b:m.shoe });
function drawPerson(sp, x, y, m, flip) {
  drawSprite(sp, x, y, pal(m), flip);
  if (m.glasses) {
    px(x+3, y+4, 3, 2, "#2e2a33"); px(x+7, y+4, 3, 2, "#2e2a33");
    px(x+6, y+5, 1, 1, "#2e2a33");
  }
}
function drawFamily(t) {
  for (const m of family) {
    const party = state.mode === "party" || state.mode === "message";
    const hop = party ? -(Math.max(0, Math.sin(t*6 + m.bob) * 4) | 0)
                      : (Math.sin(t*1.6 + m.bob) > 0.94 ? -1 : 0);
    const sp = m.long ? (party ? SPR.f_cheer : SPR.f_idle) : (party ? SPR.m_cheer : SPR.m_idle);
    drawPerson(sp, m.x, KY - 18 + hop, m, m.faceLeft);
  }
  if (CONFIG.dog) drawSprite(Math.sin(t*7) > 0 ? DOG_WAG : DOG_IDLE, dogPos.x, dogPos.y, DOG_PAL, false);
}
function drawCake(t) {
  drawSprite(CAKE, CAKE_X, CAKE_Y, CAKE_PAL, false);
  if (!state.candles) { for (const c of CANDLE_X) px(CAKE_X+c+1, CAKE_Y+2, 1, 1, "#5a4a3a"); return; }
  for (let i = 0; i < CANDLE_X.length; i++) {
    const c = CANDLE_X[i], f = Math.sin(t*9 + i*2) > 0 ? 0 : 1;
    px(CAKE_X+c+1, CAKE_Y+1-f, 1, 2+f, C.warm);
    px(CAKE_X+c+1, CAKE_Y-f, 1, 1, "#fff4b0");
    ctx.globalAlpha = 0.13; px(CAKE_X+c-4, CAKE_Y-5, 10, 15, C.warm); ctx.globalAlpha = 1;
  }
}
function drawDad(t) {
  let sp = SPR.m_idle;
  if (state.mode === "party" || state.mode === "message") sp = SPR.m_cheer;
  else if (state.open) sp = SPR.m_look;
  else if (!dad.onGround) sp = SPR.m_jump;
  else if (dad.vx !== 0) sp = (dad.anim|0) % 2 ? SPR.m_w1 : SPR.m_w2;
  let y = dad.y;
  if (state.mode === "party") y -= Math.max(0, Math.sin(t*6)*4) | 0;
  drawPerson(sp, dad.x - 2, y, CONFIG.dadLook, dad.flip);
}
function drawConfetti(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.life -= dt;
    if (p.life <= 0) { confetti.splice(i,1); continue; }
    p.sway += dt*4;
    p.x += (p.vx + Math.sin(p.sway)*16) * dt;
    p.y += p.vy * dt;
    p.vy = Math.min(p.vy + 22*dt, 42);
    if (p.y > KY - 1) { confetti.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, p.life);
    px(p.x, p.y, p.s, p.s, p.col);
    ctx.globalAlpha = 1;
  }
}
const darkness = i => Math.max(0, [0.50,0.42,0.34,0.26,0.16,0][i] - lightsOn[i] * 0.18);

// ────────────────────────────────────────────────────────────── overlays ──
function panel(x, y, w, h) {
  ctx.globalAlpha = 0.94; px(x, y, w, h, C.panel); ctx.globalAlpha = 1;
  px(x, y, w, 1, C.panelHi); px(x, y+h-1, w, 1, C.panelHi);
  px(x, y, 1, h, C.panelHi); px(x+w-1, y, 1, h, C.panelHi);
}
function drawOpenPainting(dt) {
  state.openT = Math.min(1, state.openT + dt*5);
  const a = state.openT;
  ctx.globalAlpha = 0.86 * a; px(0, 0, VIEW_W, VIEW_H, "#080a14"); ctx.globalAlpha = 1;
  const s = 4, w = ART_W*s, h = ART_H*s;
  const x = Math.round((VIEW_W - w)/2), y = Math.round(VIEW_H*0.30 - h/2);
  ctx.globalAlpha = a;
  px(x-5, y-5, w+10, h+10, C.frame);
  px(x-5, y-5, w+10, 2, C.frameHi); px(x-5, y-5, 2, h+10, C.frameHi);
  px(x-2, y-2, w+4, h+4, "#241d18");
  scene(state.open.scene, x, y, s);
  let ty = y + h + 16;
  drawText(state.open.title, VIEW_W/2, ty, C.gold, "center");
  ty += 15;
  for (const l of wrap(state.open.caption, VIEW_W - 18)) { drawText(l, VIEW_W/2, ty, C.ink, "center"); ty += LINE_H; }
  if (a >= 1 && Math.sin(state.t*3) > -0.3) drawText("▲ close", VIEW_W/2, VIEW_H - 34, "#8d93b5", "center");
  ctx.globalAlpha = 1;
}
function drawHud(dt) {
  if (banner.t > 0) {
    banner.t -= dt;
    ctx.globalAlpha = clamp(banner.t > 2.6 ? (3.2-banner.t)/0.6 : Math.min(1, banner.t/0.7), 0, 1);
    drawText(banner.text, VIEW_W/2, 12, C.gold, "center");
    ctx.globalAlpha = 1;
  }
  if (state.mode === "play" && !state.open) {
    const p = nearPainting();
    const prompt = p ? (p.seen ? "▲ look again" : "▲ look")
                     : (nearCake() && !state.candles ? "▲ light the candles" : null);
    document.getElementById("ba").classList.toggle("hint", !!prompt);
    if (prompt && Math.sin(state.t*4) > -0.3) drawText(prompt, VIEW_W/2, VIEW_H - 26, C.cream, "center");
  }
  if (state.surpriseT > 0) {
    state.surpriseT -= dt;
    const w = textW(CONFIG.surprise) + 10;
    panel(VIEW_W/2 - w/2, 26, w, 14);
    drawText(CONFIG.surprise, VIEW_W/2, 29, C.gold, "center");
  }
}
function drawTitle(t) {
  px(0, 0, VIEW_W, VIEW_H, C.night);
  for (let i = 0; i < 40; i++) {
    ctx.globalAlpha = 0.35 + 0.4*Math.abs(Math.sin(t*1.2 + i));
    px((i*71) % VIEW_W, (i*53) % (VIEW_H*0.55), 1, 1, C.star);
    ctx.globalAlpha = 1;
  }
  const hw = 78, hh = 96, hx = (VIEW_W-hw)>>1, hy = (VIEW_H>>1) - 22;
  for (let x = 0; x < hw; x++) {
    const h = Math.max(2, 20 - Math.abs(x - hw/2)*16/(hw/2));
    px(hx+x, hy-h, 1, h, "#6a4a44");
  }
  px(hx, hy, hw, hh, "#2e2a35"); px(hx, hy, hw, 1, "#453e4e");
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) px(hx+11+c*22, hy+14+r*22, 12, 12, "#1b1a26");
  ctx.globalAlpha = 0.8 + 0.2*Math.sin(t*2);
  px(hx+11, hy+14, 56, 12, "#f3c96a");
  ctx.globalAlpha = 1;
  px(hx+18, hy+17, 3, 9, "#8a6a2e"); px(hx+26, hy+19, 3, 7, "#8a6a2e");
  px(hx+34, hy+16, 3, 10, "#8a6a2e"); px(hx+42, hy+20, 3, 6, "#8a6a2e");
  ctx.globalAlpha = 0.12; px(hx-6, hy+8, hw+12, 28, C.warm); ctx.globalAlpha = 1;
  px(hx+33, hy+hh-18, 12, 18, "#4a3628");
  drawPerson(SPR.m_idle, hx+17, hy+hh-18, CONFIG.dadLook, false);
  px(hx-26, hy+hh, hw+52, 3, "#1a1a26");
  drawText("HAPPY BIRTHDAY", VIEW_W/2, 32, C.gold, "center");
  drawText(CONFIG.dadName.toUpperCase(), VIEW_W/2, 44, C.cream, "center");
  drawText("get to the top floor", VIEW_W/2, 62, "#8d93b5", "center");
  if (Math.sin(t*3) > -0.4) drawText("tap to begin", VIEW_W/2, VIEW_H-40, C.ink, "center");
}
function drawMessage(dt) {
  state.fade = Math.min(1, state.fade + dt*0.8);
  ctx.globalAlpha = 0.88*state.fade; px(0, 0, VIEW_W, VIEW_H, "#0a0c18"); ctx.globalAlpha = 1;
  if (state.fade < 0.25) return;
  ctx.globalAlpha = clamp((state.fade-0.25)/0.6, 0, 1);
  const lines = [];
  for (const l of CONFIG.finaleLines) l === "" ? lines.push("") : lines.push(...wrap(l, VIEW_W-20));
  let y = Math.round((VIEW_H - (42 + lines.length*LINE_H))/2) - 12;
  drawText(CONFIG.finaleTitle, VIEW_W/2, y, C.gold, "center"); y += 20;
  for (const l of lines) { drawText(l, VIEW_W/2, y, C.ink, "center"); y += LINE_H; }
  y += 10;
  drawText(CONFIG.signature, VIEW_W/2, y, C.pink, "center");
  drawSprite(CAKE, (VIEW_W-18)/2, y+16, CAKE_PAL, false);
  for (let i = 0; i < CANDLE_X.length; i++) {
    const f = Math.sin(state.t*9 + i*2) > 0 ? 0 : 1;
    px((VIEW_W-18)/2 + CANDLE_X[i] + 1, y+17-f, 1, 2+f, C.warm);
  }
  ctx.globalAlpha = 1;
}

// ────────────────────────────────────────────── full-house design render ──
function drawHousePreview() {
  px(0, 0, VIEW_W, VIEW_H, C.night);
  for (let i = 0; i < FLOORS; i++) drawRoom(i);
  drawStairs();
  drawPaintings(1.2);
  drawCake(0);
  drawFamily(0.2);
  drawPerson(SPR.m_idle, dad.x-2, dad.y, CONFIG.dadLook, false);
  drawSlabs();
  for (let i = 0; i < FLOORS; i++) {
    const d = [0.30,0.24,0.19,0.14,0.08,0][i];
    if (!d) continue;
    ctx.globalAlpha = d; px(0, roomTop(i), ROOM_W, FLOOR_H, "#0a0c1c"); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < FLOORS; i++) {
    const label = (i === TOP ? CONFIG.kitchenName : CONFIG.floors[i].name).toUpperCase();
    const right = goesRight(i);                       // stairs on the right → label left
    const x = right ? 6 : ROOM_W - 6, y = roomTop(i) + 3;
    const w = textW(label) + 6;
    ctx.globalAlpha = 0.55;
    px(right ? 3 : ROOM_W - w - 3, y - 2, w, 13, "#0c0e1c");
    ctx.globalAlpha = 1;
    drawText(label, x, y, "#8f9ad0", right ? "left" : "right");
  }
}

// ─────────────────────────────────────────────────────────────── the loop ──
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  state.t += dt;

  if (PREVIEW) { drawHousePreview(); requestAnimationFrame(frame); return; }
  if (state.mode === "title") { drawTitle(state.t); requestAnimationFrame(frame); return; }

  if (state.mode === "play" && !state.open) {
    movePlayer(dt);
    if (dad.floor === TOP && state.surpriseT === 0 && !state.candles) {
      state.surpriseT = 2.6; sfx.pop();
      for (const f of family) f.faceLeft = dad.x < f.x;
    }
  } else if (state.mode === "party") {
    state.partyT += dt;
    if (state.partyT < 2.2 && Math.random() < 0.35) spawnConfetti();
    if (state.partyT > 7) showMessage();
  }
  for (let i = 0; i < FLOORS; i++)
    lightsOn[i] = lerp(lightsOn[i], i <= visited ? 1 : 0, 1 - Math.pow(0.001, dt));

  const tx = state.camLockX !== null ? state.camLockX
           : clamp(dad.x + P_W/2 - VIEW_W/2, 0, ROOM_W - VIEW_W);
  const ty = clamp(dad.y + P_H/2 - VIEW_H*0.56, 0, Math.max(0, WORLD_BOT - VIEW_H));
  const k = 1 - Math.pow(0.0015, dt);
  cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);

  px(0, 0, VIEW_W, VIEW_H, C.night);
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  for (let i = 0; i < FLOORS; i++) drawRoom(i);
  drawStairs();
  drawPaintings(state.t);
  drawCake(state.t);
  drawFamily(state.t);
  drawDad(state.t);
  drawSlabs();                       // drawn last so he ducks under the ceiling
  drawConfetti(dt);
  for (let i = 0; i < FLOORS; i++) {
    const d = darkness(i);
    if (d <= 0.001) continue;
    const y0 = roomTop(i) - (i === TOP ? ROOF : 0);
    const hh = FLOOR_H + (i === TOP ? ROOF : 0);
    ctx.globalAlpha = d; px(-4, y0, ROOM_W+8, hh, "#0a0c1c"); ctx.globalAlpha = 1;
  }
  ctx.restore();

  const warmth = clamp(visited/TOP, 0, 1);
  if (warmth > 0.01) { ctx.globalAlpha = 0.05*warmth; px(0,0,VIEW_W,VIEW_H,C.warm); ctx.globalAlpha = 1; }

  drawHud(dt);
  if (state.open) drawOpenPainting(dt);
  if (state.mode === "message") drawMessage(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
