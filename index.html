    background:rgba(255,255,255,0.10); border:2px solid rgba(255,255,255,0.22);

  #pad.hide, #mute.hide { opacity:0; pointer-events:none; }
  #pad, #mute { transition:opacity .4s; }

    position:fixed; inset:0; z-index:15;
    background:rgba(6,6,14,0.93);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0; transition:opacity .25s;

  #tv.hide { opacity:0; pointer-events:none; }
  #tvset {
    width:min(92vw, 620px);
    background:#23262f; border:4px solid #16181f; border-radius:6px;
    padding:10px 10px 14px 10px;
    box-shadow:0 0 0 2px #3a3f4c inset;
    position:relative;
  }
  #tvscreen {
    width:100%; aspect-ratio:16/9; background:#0a0c14; overflow:hidden;
    border:2px solid #0d0f16;
  }
  #tvscreen iframe { width:100%; height:100%; border:0; display:block; }
  #tvlight {

const LINE_H = 10, SPACE_W = 4;
const font = {};
for (const ch in GLYPHS) {
  const rows = GLYPHS[ch].split("/");
  let min = 5, max = -1;
  for (const r of rows) for (let c = 0; c < 5; c++)
    if (r[c] === "1") { if (c < min) min = c; if (c > max) max = c; }
  font[ch] = max < 0 ? { w:SPACE_W, min:0, rows:[] } : { w:max-min+1, min, rows };
}
function textW(str) {
  let w = 0;
  for (const ch of str) { if (ch === " ") { w += SPACE_W; continue; } const g = font[ch]; w += (g ? g.w : 3) + 1; }
  return Math.max(0, w - 1);
}
function drawText(str, x, y, color, align) {
  if (!str) return;
  let dx = align === "center" ? Math.round(x - textW(str)/2)
         : align === "right"  ? Math.round(x - textW(str)) : Math.round(x);
  y = Math.round(y);
  ctx.fillStyle = color;
  for (const ch of str) {
    if (ch === " ") { dx += SPACE_W; continue; }
    const g = font[ch];
    if (!g) { dx += 4; continue; }
    for (let r = 0; r < g.rows.length; r++) {
      const row = g.rows[r];
      for (let c = 0; c < g.w; c++) if (row[g.min + c] === "1") ctx.fillRect(dx + c, y + r, 1, 1);
    }
    dx += g.w + 1;
  }
}
function wrap(str, maxPx) {
  const out = []; let line = "";
  for (const w of str.split(" ")) {
    const t = line ? line + " " + w : w;
    if (textW(t) > maxPx && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
function resize() {
  if (PREVIEW) { VIEW_W = ROOM_W; VIEW_H = WORLD_BOT; }
  else {

const downArch = i => arches.find(a => a.floor === i && !a.up);

function movePlayer(dt) {
  const dir = (keys.right?1:0) - (keys.left?1:0);
  dad.vx = dir * WALK;
  if (dir) dad.flip = dir < 0;
  dad.x = clamp(dad.x + dad.vx*dt, 4, ROOM_W - P_W - 4);

  const ground = groundY(dad.floor) - P_H;
  if (dad.onGround) dad.y = ground;
  else {
    dad.vy += GRAV*dt;
    dad.y += dad.vy*dt;
    if (dad.y >= ground) { dad.y = ground; dad.vy = 0; dad.onGround = true; }
  }
  if (dad.onGround && dir) {
    dad.anim += dt * 7.5;
    stepTimer -= dt;
    if (stepTimer <= 0) { stepTimer = 0.26; sfx.step(); }
  } else if (!dir) { dad.anim = 0; stepTimer = 0; }
}

// ───────────────────────────────────────────────────────────────── audio ──
const audio = { ctx:null, gain:null, muted:!CONFIG.music, next:0, step:0 };
function initAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  audio.gain = audio.ctx.createGain();
  audio.gain.gain.value = audio.muted ? 0 : 0.5;
  audio.gain.connect(audio.ctx.destination);
  if (CONFIG.music) { audio.next = audio.ctx.currentTime + 0.2; setInterval(schedule, 90); }
}
function note(freq, when, dur, vol, type) {
  if (!audio.ctx) return;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(audio.gain);
  o.start(when); o.stop(when + dur + 0.03);
}
const N = { C4:261.6,D4:293.7,E4:329.6,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,G5:784,C6:1046.5 };
const LOOP = [N.C4,N.E4,N.G4,N.E4,N.A4,N.G4,N.E4,N.D4];
function schedule() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  if (state.mode === "party" || state.mode === "message" || state.tvOpen) {
    audio.next = t + 0.3;      // keep the clock current so resume doesn't flood
    return;
  }
  while (audio.next < t + 0.4) {
    const i = audio.step % LOOP.length;
    note(LOOP[i], audio.next, 0.45, 0.045, "triangle");
    if (visited >= 2 && i % 2 === 0) note(LOOP[i]*2, audio.next, 0.3, 0.02, "square");
    if (visited >= 4) note(LOOP[i]/2, audio.next, 0.5, 0.03, "sine");
    audio.next += 0.34; audio.step++;
  }
}
const sfx = {
  step()  { if (audio.ctx) note(90 + Math.random()*22, audio.ctx.currentTime, 0.05, 0.03, "square"); },
  jump()  { if (audio.ctx) { const t = audio.ctx.currentTime; note(330,t,0.09,0.06); note(520,t+0.05,0.09,0.05); } },
  chime() { if (audio.ctx) { const t = audio.ctx.currentTime; [N.E5,N.G5,N.C6].forEach((f,i)=>note(f,t+i*0.075,0.3,0.07,"triangle")); } },
  // footsteps going up a flight of stairs
  climb() { if (audio.ctx) { const t = audio.ctx.currentTime;
              for (let i = 0; i < 6; i++) note(120 + i*26, t + i*0.075, 0.06, 0.045, "square"); } },
  arrive(){ if (audio.ctx) { const t = audio.ctx.currentTime; note(N.G4,t,0.16,0.05,"triangle"); note(N.C5,t+0.1,0.24,0.05,"triangle"); } },
  key()   { if (audio.ctx) note(900 + Math.random()*700, audio.ctx.currentTime, 0.03, 0.018, "square"); },
  pop()   { if (audio.ctx) note(180 + Math.random()*400, audio.ctx.currentTime, 0.1, 0.05, "square"); },
};
const HB_SONG = [
  [N.D4,.5],[N.D4,.25],[N.E4,.75],[N.D4,.75],[N.G4,.75],[N.A4,1.4],
  [N.D4,.5],[N.D4,.25],[N.E4,.75],[N.D4,.75],[N.A4,.75],[N.G4,1.4],
  [N.D4,.5],[N.D4,.25],[N.D5,.75],[N.B4,.75],[N.G4,.75],[N.A4,.75],[N.E4,1.4],
  [N.C5,.5],[N.C5,.25],[N.B4,.75],[N.G4,.75],[N.A4,.75],[N.G4,1.8],
];
function playHappyBirthday() {
  if (!audio.ctx) return;
  let t = audio.ctx.currentTime + 0.35;
  for (const [f, len] of HB_SONG) {
    note(f, t, len*0.39, 0.09, "triangle");
    note(f/2, t, len*0.39, 0.045, "sine");
    t += len * 0.42;
  }
}

// ─────────────────────────────────────────────────────────────── actions ──
function action() {
  if (state.mode === "title") { start(); return; }
  if (state.climb) return;
  if (state.tvOpen) { closeTV(); return; }
  if (state.open) { closePainting(); return; }
  if (state.mode === "play") {
    if (state.working) { stopWork(); return; }
    const p = nearPainting();
    if (p) { openPainting(p); return; }
    const a = nearArch();
    if (a) { goUp(a); return; }
    if (nearTV()) { openTV(); return; }
    if (nearDesk()) { startWork(); return; }
    if (nearCake() && !state.candles) { blowOut(); return; }
    if (nearDog()) { petDog(); return; }
    if (dad.onGround) { dad.onGround = false; dad.vy = JUMP_V; sfx.jump(); }
    return;
  }
  if (state.mode === "party" && state.partyT > 3.2) showMessage();
}
function start() {
  if (state.mode !== "title") return;
  initAudio();
  state.mode = "play";
  document.getElementById("pad").classList.remove("hide");
  muteEl.classList.remove("hide");
  banner.text = CONFIG.floors[0].name; banner.t = 3.2;
}
// walk into the stairwell, black out, step out of the one on the floor above

}
function finishClimb() {
  const to = state.climb.to;
  dad.floor = to;
  const d = downArch(to);
  dad.x = d.x + ARCH_W/2 - P_W/2;
  dad.y = groundY(to) - P_H;
  dad.vy = 0; dad.onGround = true;
  dad.flip = !goesRight(to);           // face the way he needs to walk
  banner.text = to === TOP ? CONFIG.kitchenName : CONFIG.floors[to].name;
  banner.t = 3.2;
  if (to > visited) { visited = to; sfx.arrive(); }
  if (to === TOP && !state.candles) {
    state.surpriseT = 2.6; sfx.pop();
    for (const f of family) f.faceLeft = dad.x < f.x;
  }
}
// ── the framed close-up: pixel art that develops into the real photo ──
const ph = {
  el: document.getElementById("ph"), cv: document.getElementById("phcv"),
  ctx: document.getElementById("phcv").getContext("2d"),
  token: 0,
};
function phFit(w, h) {
  const scale = Math.min(innerWidth * 0.84 / w, innerHeight * 0.5 / h);
  return { w: Math.round(w * scale), h: Math.round(h * scale) };
}
function phDrawScene(id) {
  const s = 4;
  ph.cv.width = ART_W * s; ph.cv.height = ART_H * s;
  const fit = phFit(ART_W, ART_H);
  ph.cv.style.width = fit.w + "px"; ph.cv.style.height = fit.h + "px";
  dctx = ph.ctx;
  px(0, 0, ART_W * s, ART_H * s, "#111");
  scene(id, 0, 0, s);
  dctx = ctx;
}
function openPainting(p) {
  state.open = p; p.seen = true;
  keys.left = keys.right = false;
  sfx.chime();
  const token = ++ph.token;
  document.getElementById("phtitle").textContent = p.title || "";
  phDrawScene(p.scene);
  ph.el.classList.remove("hide");
  if (!p.photo) return;
  const img = new Image();
  img.onload = () => {
    if (token !== ph.token) return;
    setTimeout(() => { if (token === ph.token) developPhoto(img, token); }, 420);
  };
  img.src = p.photo;
}
function developPhoto(img, token) {
  const cap = Math.min(img.naturalWidth, 1300);
  const W = cap, H = Math.round(img.naturalHeight * cap / img.naturalWidth);
  ph.cv.width = W; ph.cv.height = H;
  const fit = phFit(W, H);
  ph.cv.style.width = fit.w + "px"; ph.cv.style.height = fit.h + "px";
  const tmp = document.createElement("canvas"), tctx = tmp.getContext("2d");
  const t0 = performance.now(), DUR = 1150;
  function step(now) {
    if (token !== ph.token) return;
    const t = clamp((now - t0) / DUR, 0, 1);
    const ease = 1 - (1 - t) * (1 - t);
    const block = Math.max(1, Math.round(lerp(56, 1, ease)));
    if (block <= 1) {
      ph.ctx.imageSmoothingEnabled = true;
      ph.ctx.drawImage(img, 0, 0, W, H);
      sfx.chime();
      return;
    }
    tmp.width = Math.max(1, Math.ceil(W / block));
    tmp.height = Math.max(1, Math.ceil(H / block));
    tctx.imageSmoothingEnabled = true;
    tctx.drawImage(img, 0, 0, tmp.width, tmp.height);
    ph.ctx.imageSmoothingEnabled = false;
    ph.ctx.drawImage(tmp, 0, 0, tmp.width, tmp.height, 0, 0, W, H);
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function closePainting() {
  ph.token++;                       // cancels any develop in flight
  state.open = null;
  ph.el.classList.add("hide");
}
ph.el.addEventListener("pointerdown", e => { e.preventDefault(); closePainting(); });

function drawHearts(dt) {

// ──────────────────────────────────────────────────────────── rendering ──
function wallpaper(i) {
  const R = ROOM[i], ty = roomTop(i), gy = groundY(i);
  px(0, ty, ROOM_W, ROOM_H, R.wall);
  if (R.pat === "dot") {
    for (let x = 6; x < ROOM_W; x += 14)
      for (let y = ty + 6; y < gy - 6; y += 12) { px(x, y, 2, 2, R.alt); px(x+7, y+6, 2, 2, R.alt); }
  } else if (R.pat === "diamond") {
    for (let x = 8; x < ROOM_W; x += 16)
      for (let y = ty + 8; y < gy - 6; y += 14) {
        px(x, y-2, 1, 1, R.alt); px(x-1, y-1, 3, 1, R.alt); px(x-2, y, 5, 1, R.alt);
        px(x-1, y+1, 3, 1, R.alt); px(x, y+2, 1, 1, R.alt);
      }
  } else if (R.pat === "stripe") {
    for (let x = 0; x < ROOM_W; x += 12) px(x, ty, 4, ROOM_H, R.alt);
  } else {
    for (let y = ty + 8; y < gy; y += 9) px(0, y, ROOM_W, 1, R.alt);
  }
  px(0, ty, ROOM_W, 2, R.trim);                       // cornice
  px(0, gy - 7, ROOM_W, 7, R.trim);                   // skirting
  px(0, gy - 7, ROOM_W, 1, R.alt);
}

// the stairwell: black arch, white banisters, exactly the reference
function drawArch(a) {
  const gy = groundY(a.floor);
  const x = a.x, y = gy - ARCH_H, w = ARCH_W, h = ARCH_H;
  const R = ROOM[a.floor];
  // moulded surround, a shade darker than the wallpaper
  for (let r = -3; r < h; r++) {
    const rr = Math.max(0, r);
    const ins = rr < 10 ? Math.round(10 - Math.sqrt(Math.max(0,100 - (10-rr)*(10-rr)))) : 0;
    px(x + ins - 3, y + r, w - ins*2 + 6, 1, R.trim);
  }
  // the black hole
  for (let r = 0; r < h; r++) {
    const ins = r < 10 ? Math.round(10 - Math.sqrt(Math.max(0,100 - (10-r)*(10-r)))) : 0;
    px(x + ins, y + r, w - ins*2, 1, "#0a0810");
  }
  // banisters inside
  const dirR = a.right;                       // flight runs toward this side
  const x0 = x + 6, x1 = x + w - 6, span = x1 - x0;
  const loY = gy - 6, hiY = gy - (a.up ? 32 : 26);
  for (let i = 0; i <= span; i++) {
    const t = i / span;
    const rx = dirR ? x0 + i : x1 - i;
    const ry = Math.round(lerp(loY, hiY, t));
    px(rx, ry, 1, 2, C.rail);
    px(rx, ry + 2, 1, 1, C.railLo);
    if (i % 5 === 0 && i > 1) px(rx, ry + 2, 1, Math.min(11, gy - 2 - ry), C.rail);
  }
  px(dirR ? x0 : x1 - 1, loY - 2, 2, 12, C.rail);      // newel post
  // a short second rail in the foreground, like the reference
  const fx = dirR ? x + w - 14 : x + 4;
  for (let i = 0; i < 10; i++) {
    const rx = dirR ? fx + i : fx + 9 - i;
    const ry = gy - 3 - i;
    px(rx, ry, 1, 2, C.rail);
    if (i % 4 === 0) px(rx, ry + 2, 1, 6, C.rail);
  }
  if (a.up) {                                          // light spilling down
    ctx.globalAlpha = 0.10 + 0.04 * Math.sin(state.t * 2);
    px(x + 4, y + 2, w - 8, h - 6, C.warm);
    ctx.globalAlpha = 1;
  }
}

function drawConfetti(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.life -= dt;
    if (p.life <= 0) { confetti.splice(i,1); continue; }
    p.sway += dt*4;
    p.x += (p.vx + Math.sin(p.sway)*16) * dt;
    p.y += p.vy * dt;
    p.vy = Math.min(p.vy + 22*dt, 42);
    if (p.y > KY - 1) { confetti.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, p.life);
    px(p.x, p.y, p.s, p.s, p.col);
    ctx.globalAlpha = 1;
  }
}

// ─────────────────────────────────────────────────────────────── the loop ──
const CLIMB_T = 0.72;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  state.t += dt;

  if (PREVIEW) { drawHousePreview(); requestAnimationFrame(frame); return; }
  if (state.mode === "title") { drawTitle(state.t); requestAnimationFrame(frame); return; }

  if (state.climb) {
    state.climb.t += dt;
    if (state.climb.t >= CLIMB_T/2 && !state.climb.done) { state.climb.done = true; finishClimb(); }
    if (state.climb.t >= CLIMB_T) state.climb = null;
  } else if (state.mode === "play" && state.working) {
    typeTimer -= dt;
    if (typeTimer <= 0) { typeTimer = 0.07 + Math.random() * 0.15; sfx.key(); }
  } else if (state.mode === "play" && !state.open && !state.tvOpen) {
    movePlayer(dt);
  } else if (state.mode === "party") {
    state.partyT += dt;
    if (state.partyT < 2.2 && Math.random() < 0.35) spawnConfetti();
    if (state.partyT > 7) showMessage();
  }
  for (let i = 0; i < FLOORS; i++)
    lightsOn[i] = lerp(lightsOn[i], i <= visited ? 1 : 0, 1 - Math.pow(0.001, dt));

  const tx = state.camLockX !== null ? state.camLockX
           : clamp(dad.x + P_W/2 - VIEW_W/2, 0, ROOM_W - VIEW_W);
  const ty = clamp(dad.y + P_H/2 - VIEW_H*0.56, 0, Math.max(0, WORLD_BOT - VIEW_H));
  const k = state.climb ? 1 : 1 - Math.pow(0.0015, dt);
  cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);

  px(0, 0, VIEW_W, VIEW_H, C.night);
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  drawRoof();
  for (let i = 0; i < FLOORS; i++) { drawRoom(i); drawFloorBand(i); }
  drawPaintings(state.t);
  drawCake(state.t);
  drawFamily(state.t);
  drawDad(state.t);
  drawHearts(dt);
  drawConfetti(dt);
  for (let i = 0; i < FLOORS; i++) {
    const d = darkness(i);
    if (d <= 0.001) continue;
    const y0 = roomTop(i) - (i === TOP ? ROOF : 0);
    const hh = FLOOR_H + (i === TOP ? ROOF : 0);
    ctx.globalAlpha = d; px(-4, y0, ROOM_W+8, hh, "#0a0c1c"); ctx.globalAlpha = 1;
  }
  ctx.restore();

  // mosaic out the kitchen until he steps out of the last stairwell,
  // then dissolve it sharp over a second
  mystery.t = clamp(mystery.t + (visited >= TOP ? dt / 1.1 : 0), 0, 1);
  if (mystery.t < 1) {
    const block = Math.max(2, Math.round(lerp(8, 1, mystery.t)));
    const y0 = clamp(Math.round(roomTop(TOP) - ROOF - cam.y), 0, VIEW_H);
    const y1 = clamp(Math.round(groundY(TOP) + SLAB - cam.y), 0, VIEW_H);
    const h = y1 - y0;
    if (h > 4) {
      mystery.cv.width  = Math.ceil(VIEW_W / block);
      mystery.cv.height = Math.ceil(h / block);
      mysteryCtx.imageSmoothingEnabled = true;   // average down = soft
      mysteryCtx.drawImage(cv, 0, y0, VIEW_W, h, 0, 0, mystery.cv.width, mystery.cv.height);
      ctx.imageSmoothingEnabled = false;         // blow up = chunky
      ctx.drawImage(mystery.cv, 0, 0, mystery.cv.width, mystery.cv.height, 0, y0, VIEW_W, h);
    }
  }

  const warmth = clamp(visited/TOP, 0, 1);
  if (warmth > 0.01) { ctx.globalAlpha = 0.05*warmth; px(0,0,VIEW_W,VIEW_H,C.warm); ctx.globalAlpha = 1; }

  drawHud(dt);
  if (state.climb) {                                  // black out the stair climb
    const h = state.climb.t / CLIMB_T;
    ctx.globalAlpha = 1 - Math.abs(h - 0.5) * 2;
    px(0, 0, VIEW_W, VIEW_H, "#07060c");
    ctx.globalAlpha = 1;
  }
  if (state.mode === "message") drawMessage(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
